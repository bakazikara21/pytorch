<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Todo App</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>📝 My Todo List</h1>
  
  <form action="/add" method="post">
    <input type="text" name="task" placeholder="やることを書く" required>
    <button type="submit">追加</button>
  </form>

  <ul>
    {% for todo in todos %}
      <li>{{ todo }}</li>
    {% endfor %}
  </ul>
</body>
</html>
